[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootcause-sdk"
version = "0.1.0"
description = "Official Python SDK for the RootCause platform API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RootCause", email = "engineering@rootcause.ai" }]
keywords = ["rootcause", "causal-inference", "digital-twin", "sdk", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://rootcause.ai"
Repository = "https://gitlab.com/perceptura/sdks/rootcause-python"
Documentation = "https://docs.rootcause.ai"

[tool.hatch.build.targets.wheel]
packages = ["rootcause"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootcause-sdk"
version = "0.0.0"
description = "Official Python SDK for the RootCause causal AI platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RootCause", email = "engineering@rootcause.ai" }]
keywords = ["rootcause", "causal-inference", "digital-twin", "sdk", "api-client", "jupyter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
graph = ["networkx>=3.0"]
jupyter = ["anywidget>=0.9"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "griffe>=1.0",  # used directly by scripts/generate_gitbook_reference.py
    "ruff",  # mkdocstrings uses it to format the separated signatures
]

[project.urls]
Homepage = "https://rootcause.ai"
Repository = "https://gitlab.com/perceptura/sdks/rootcause-python"
Documentation = "https://docs.rootcause.ai"

[tool.hatch.build.targets.wheel]
packages = ["rootcause"]

[tool.pytest.ini_options]
testpaths = ["tests"]
